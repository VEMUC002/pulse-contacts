<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Pulse Contacts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #150510;
        --surface: #22101d;
        --surface-2: #2d1626;
        --text: #f7eef4;
        --dim: #b9a3b2;
        --border: #43253a;
        --accent: #ff2e7e;
        --accent-ink: #ffffff;
        --amber: #ffb03a;
        --green: #34d399;
        --radius: 14px;
        --font-display: "Unbounded", system-ui, sans-serif;
        --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button { font-family: inherit; cursor: pointer; }
      a { color: var(--accent); }
      .font-display { font-family: var(--font-display); }

      /* ---------- shared form bits ---------- */
      .field-label { display: block; font-size: 14px; font-weight: 500; color: var(--dim); margin-bottom: 4px; }
      .input {
        width: 100%;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--surface-2);
        padding: 8px 12px;
        font-size: 16px;
        font-family: inherit;
        color: var(--text);
      }
      .input::placeholder { color: var(--dim); }
      .input:focus { border-color: var(--accent); outline: none; }
      textarea.input { line-height: 1.5; resize: vertical; }
      .form-stack > * + * { margin-top: 16px; }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .btn-primary {
        width: 100%;
        border: none;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--accent-ink);
        padding: 12px 16px;
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: 600;
      }
      .btn-primary:disabled { opacity: 0.6; }
      .btn-outline {
        border: 1px solid var(--border);
        background: transparent;
        border-radius: var(--radius);
        color: var(--text);
        padding: 10px 16px;
        font-size: 14px;
      }
      .btn-outline-accent {
        border: 1px solid var(--accent);
        background: transparent;
        border-radius: var(--radius);
        color: var(--accent);
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
      }
      .btn-outline:disabled, .btn-outline-accent:disabled { opacity: 0.6; }
      .msg-error { color: var(--amber); font-size: 14px; line-height: 1.6; }
      .msg-ok { color: var(--accent); font-size: 14px; line-height: 1.6; }
      .hint { font-size: 12px; color: var(--dim); line-height: 1.6; }

      /* ---------- gate screens ---------- */
      .gate { min-height: 100vh; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
      .gate-inner { margin: 0 auto; width: 100%; max-width: 28rem; padding-top: 40px; }
      .gate-kicker {
        font-family: var(--font-display);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--accent);
        margin: 0;
      }
      .gate h1 {
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 600;
        margin: 8px 0 0;
      }
      .gate .lede { margin-top: 12px; font-size: 14px; line-height: 1.7; color: var(--dim); }
      .center-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        color: var(--dim);
        font-size: 14px;
        text-align: center;
      }

      /* ---------- app chrome ---------- */
      .app-header {
        position: sticky;
        top: 0;
        z-index: 40;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        padding: max(8px, env(safe-area-inset-top)) 16px 12px;
      }
      .app-header-inner, .app-main { margin: 0 auto; width: 100%; max-width: 72rem; }
      .header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; }
      .header-counts { font-size: 14px; color: var(--dim); margin: 0; }
      .header-counts strong { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--text); }
      .crew-btn {
        flex-shrink: 0;
        border: 1px solid var(--border);
        background: transparent;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 14px;
        color: var(--text);
      }
      .tabs { display: flex; gap: 4px; margin-top: 12px; }
      .tab-btn {
        flex: 1;
        border-radius: 8px;
        padding: 8px;
        font-family: var(--font-display);
        font-size: 12px;
        font-weight: 600;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--dim);
      }
      .tab-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .tab-badge {
        margin-left: 6px;
        border-radius: 999px;
        padding: 1px 6px;
        font-size: 12px;
        font-family: var(--font-body);
        background: var(--amber);
        color: #000;
      }
      .tab-btn[aria-pressed="true"] .tab-badge { background: rgba(0,0,0,0.3); color: #fff; }
      .app-main { padding: 16px 16px 112px; }

      /* ---------- cards & board ---------- */
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 12px;
      }
      .card-open { display: block; width: 100%; text-align: left; background: none; border: none; padding: 0; color: inherit; }
      .card-name { font-size: 16px; font-weight: 600; line-height: 1.5; }
      .card-ig { display: block; margin-top: 2px; font-size: 14px; color: var(--accent); }
      .card-next { display: block; margin-top: 6px; font-size: 14px; line-height: 1.45; }
      .card-meta { display: block; margin-top: 8px; font-size: 12px; color: var(--dim); }
      .chip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
      .badge {
        display: inline-block;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 500;
        color: var(--dim);
      }
      .chip {
        display: inline-block;
        border-radius: 999px;
        border: 1px solid var(--border);
        padding: 2px 8px;
        font-size: 12px;
        color: var(--dim);
      }
      .chip-warn { border-color: var(--amber); color: var(--amber); }
      .chip-attention { border-color: var(--amber); color: var(--amber); font-weight: 500; }
      .advance-btn {
        margin-top: 8px;
        width: 100%;
        border: 1px solid var(--accent);
        background: transparent;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 14px;
        font-weight: 500;
        color: var(--accent);
      }
      .advance-btn:disabled { opacity: 0.6; }
      .board { display: flex; flex-direction: column; gap: 24px; }
      .board-col h2 {
        font-family: var(--font-display);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--dim);
        margin: 0;
      }
      .board-col h2 .count { color: var(--accent); }
      .col-cards { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
      .col-empty {
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        padding: 12px;
        font-size: 12px;
        color: var(--dim);
      }
      @media (min-width: 1024px) {
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
        .tab-btn { font-size: 14px; }
      }
      .attention-banner {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 16px;
        border: 1px solid var(--amber);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 12px 16px;
        color: var(--text);
      }
      .attention-banner .ab-title { font-size: 14px; font-weight: 500; color: var(--amber); }
      .attention-banner .ab-sub { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
      .empty-state {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 24px;
        text-align: center;
      }
      .empty-state h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; }
      .empty-state p { margin: 8px auto 0; max-width: 24rem; font-size: 14px; line-height: 1.7; color: var(--dim); }
      .empty-state .btn-primary { width: auto; margin-top: 16px; padding: 10px 20px; }

      /* ---------- list view ---------- */
      .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
      .filter-btn {
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 14px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--dim);
      }
      .filter-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
      .list-rows { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
      .list-row { display: block; width: 100%; text-align: left; color: inherit; font-size: inherit; }
      .list-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--dim); }
      .list-sub .ig { color: var(--accent); font-size: 12px; }

      /* ---------- attention & activity ---------- */
      .attention-card { border-color: var(--amber); display: block; width: 100%; text-align: left; color: inherit; font-size: inherit; }
      .attention-reasons { display: block; margin-top: 4px; font-size: 14px; font-weight: 500; color: var(--amber); }
      .activity-row { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 10px 12px; }
      .activity-row .actor { font-weight: 500; color: var(--accent); }
      .activity-row p { margin: 0; font-size: 14px; }
      .activity-row .when { font-size: 12px; color: var(--dim); }
      .stack { display: flex; flex-direction: column; gap: 8px; }
      .section-intro { font-size: 14px; line-height: 1.7; color: var(--dim); margin: 0; }

      /* ---------- FAB ---------- */
      .fab {
        position: fixed;
        right: 16px;
        bottom: calc(24px + env(safe-area-inset-bottom));
        z-index: 40;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 12px 20px;
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }

      /* ---------- sheets ---------- */
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(0,0,0,0.7);
      }
      .sheet {
        max-height: 92vh;
        width: 100%;
        max-width: 32rem;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: 16px 16px 0 0;
        background: var(--bg);
        padding: 16px 16px 32px;
      }
      @media (min-width: 640px) {
        .sheet-backdrop { align-items: center; }
        .sheet { border-radius: 16px; border-bottom: 1px solid var(--border); }
      }
      .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .sheet-head h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; }
      .sheet-close {
        border: 1px solid var(--border);
        background: transparent;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 14px;
        color: var(--dim);
      }
      .sheet h3 { font-family: var(--font-display); font-size: 14px; font-weight: 600; margin: 24px 0 0; }
      .quick-links { display: flex; flex-wrap: wrap; gap: 8px; }
      .quick-links a {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        color: var(--text);
        text-decoration: none;
      }
      .member-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 8px 12px;
      }
      .member-row .m-name { font-size: 14px; font-weight: 500; margin: 0; }
      .member-row .m-name .owner-tag { margin-left: 8px; font-size: 12px; color: var(--accent); }
      .member-row .m-phone { font-size: 12px; color: var(--dim); margin: 0; }
      .remove-btn {
        border: 1px solid var(--border);
        background: transparent;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 14px;
        color: var(--dim);
        flex-shrink: 0;
      }
      .remove-btn:disabled { opacity: 0.6; }
      .delete-confirm { display: flex; gap: 8px; }
      .delete-confirm button { flex: 1; }
      .btn-danger-outline {
        border: 1px solid var(--amber);
        background: transparent;
        border-radius: var(--radius);
        color: var(--amber);
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
      }
      /* ---------- expenses ---------- */
      .exp-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
      .exp-stat { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 10px 12px; }
      .exp-stat .v { display: block; font-family: var(--font-display); font-size: 15px; font-weight: 600; }
      .exp-stat .k { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
      .status-pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); color: var(--dim); flex-shrink: 0; }
      .status-pill.st-open { border-color: var(--amber); color: var(--amber); }
      .status-pill.st-partial { border-color: var(--accent); color: var(--accent); }
      .status-pill.st-cleared { border-color: var(--green); color: var(--green); }
      .exp-amount { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
      .share-list { margin-top: 10px; border-top: 1px dashed var(--border); }
      .share-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
      .share-row:last-child { border-bottom: none; }
      .share-who { font-size: 14px; }
      .share-who .share-amt { color: var(--dim); font-size: 13px; }
      .share-toggle {
        flex-shrink: 0; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600;
        border: 1px solid var(--amber); background: transparent; color: var(--amber);
      }
      .share-toggle[aria-pressed="true"] { border-color: var(--green); color: var(--green); }
      .share-toggle:disabled { border-color: var(--border); color: var(--dim); opacity: 0.7; cursor: default; }
      .debt-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
      .debt-row:last-child { border-bottom: none; }
      .split-row { display: flex; align-items: center; gap: 8px; }
      .split-row + .split-row { margin-top: 8px; }
      .split-include {
        flex: 1; text-align: left; border: 1px solid var(--border); background: var(--surface-2);
        border-radius: 8px; padding: 8px 12px; font-size: 14px; color: var(--dim);
      }
      .split-include[aria-pressed="true"] { border-color: var(--accent); color: var(--text); font-weight: 500; }
      .split-amt { width: 96px; flex-shrink: 0; }
      .split-cleared {
        flex-shrink: 0; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 600;
        border: 1px solid var(--amber); background: transparent; color: var(--amber);
      }
      .split-cleared[aria-pressed="true"] { border-color: var(--green); color: var(--green); }
      .seg-row { display: flex; gap: 6px; }
      .seg-btn {
        flex: 1; border-radius: 8px; padding: 8px; font-size: 14px;
        border: 1px solid var(--border); background: transparent; color: var(--dim);
      }
      .seg-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="sheet-root"></div>

    <script>
      "use strict";

      /* ================================================================
         Pulse Contacts — crew-only board for Desi Pulse PNW networking
         contacts (DJs, venues, event hosts). Data lives in a Supabase
         project; every read/write goes through its RPC functions with a
         session token from phone + shared secret code sign-in.
         ================================================================ */

      var SB_URL = "https://iwglronqqiescekkfvhr.supabase.co";
      var SB_KEY = "sb_publishable_fWBN51ujRoulapGmSfc9Ow_6gfpVvz2";

      var TOKEN_KEY = "pc-token";
      var NAME_KEY = "pc-name";
      var PHONE_KEY = "pc-phone";

      var STAGES = ["To Contact", "Reached Out", "In Conversation", "Confirmed", "Not Now / Passed"];
      var TYPES = ["DJ", "Venue", "Event host", "Other"];
      var STALE_DAYS = 14;
      var EXP_CATEGORIES = ["Venue", "DJ fee", "Food & drinks", "Decor", "Transport", "Promo & printing", "Gear rental", "Tickets", "Other"];
      var EXP_STATUSES = ["All", "Open", "Partially cleared", "Cleared"];

      /* ---------------- state ---------------- */
      var state = {
        token: null,
        myName: null,
        myPhone: null,      // digits, as stored server-side
        configured: null,   // null = unknown, true/false after probe
        contacts: null,     // null = not loaded yet
        members: [],
        activity: null,
        tab: "board",
        search: "",
        typeFilter: "All",
        loadError: null,
        busyStage: {},      // contact id -> true while a stage move is in flight
        expenses: null,     // null = not loaded yet
        expensesError: null,
        busyShare: {},      // share id -> true while a cleared toggle is in flight
        expSearch: "",
        expFilter: "All"
      };

      /* ---------------- storage (session token only) ---------------- */
      function readStored(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }
      function storeValue(key, value) {
        try {
          if (value) localStorage.setItem(key, value);
          else localStorage.removeItem(key);
        } catch (e) { /* private mode: session lasts for this view only */ }
      }
      function persistSession() {
        storeValue(TOKEN_KEY, state.token);
        storeValue(NAME_KEY, state.myName);
        storeValue(PHONE_KEY, state.myPhone);
      }
      function clearSession() {
        state.token = null;
        state.myName = null;
        state.myPhone = null;
        state.contacts = null;
        state.members = [];
        state.activity = null;
        state.expenses = null;
        state.expensesError = null;
        state.busyShare = {};
        persistSession();
      }

      /* ---------------- helpers ---------------- */
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      // Exactly what the server does: strip everything but digits.
      function digits(raw) { return String(raw || "").replace(/\D/g, ""); }

      function todayStr() {
        var d = new Date();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return d.getFullYear() + "-" + m + "-" + day;
      }
      function formatFollowUp(dateStr) {
        var parts = String(dateStr).split("-").map(Number);
        var d = new Date(parts[0] || 1970, (parts[1] || 1) - 1, parts[2] || 1);
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }
      function daysSince(iso) {
        return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
      }
      function relativeTime(iso) {
        var mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
        if (mins < 1) return "just now";
        if (mins < 60) return mins + "m ago";
        var hours = Math.floor(mins / 60);
        if (hours < 24) return hours + "h ago";
        var days = Math.floor(hours / 24);
        if (days < 30) return days + "d ago";
        return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }
      function isClosed(c) { return c.stage === "Confirmed" || c.stage === "Not Now / Passed"; }

      function attentionReasons(c) {
        if (isClosed(c)) return [];
        var reasons = [];
        var today = todayStr();
        if (!c.follow_up_date) reasons.push("No follow-up set");
        else if (c.follow_up_date < today) reasons.push("Follow-up was due " + formatFollowUp(c.follow_up_date));
        else if (c.follow_up_date === today) reasons.push("Follow-up due today");
        var days = daysSince(c.updated_at);
        if (days >= STALE_DAYS) reasons.push("Untouched for " + days + " days");
        return reasons;
      }
      function typeBadge(type) {
        return '<span class="badge">' + esc(type) + "</span>";
      }
      function followUpChip(c) {
        if (!c.follow_up_date) return "";
        var today = todayStr();
        var overdue = c.follow_up_date < today && !isClosed(c);
        var dueToday = c.follow_up_date === today && !isClosed(c);
        var label = overdue
          ? "Follow-up " + formatFollowUp(c.follow_up_date) + " · overdue"
          : dueToday
            ? "Follow-up today"
            : "Follow-up " + formatFollowUp(c.follow_up_date);
        return '<span class="chip' + (overdue || dueToday ? " chip-warn" : "") + '">' + esc(label) + "</span>";
      }

      /* ---------------- expenses: server mapping & math ----------------
         Expenses live in the same Supabase project as the contacts board
         (tables expenses + expense_shares) and sync between crew phones
         through its RPC functions. All money is integer cents in the UI;
         the server stores dollar amounts. The server has no category
         column, so the category rides at the top of the notes field and
         is parsed back out on load. */
      function encodeExpNotes(category, note) {
        return "[[category:" + category + "]]" + (note ? "\n" + note : "");
      }
      function decodeExpNotes(notes) {
        var raw = String(notes == null ? "" : notes);
        var m = raw.match(/^\[\[category:([^\]]+)\]\](\n)?/);
        if (m && EXP_CATEGORIES.indexOf(m[1]) !== -1) {
          return { category: m[1], note: raw.slice(m[0].length) };
        }
        return { category: "Other", note: raw };
      }
      function mapServerExpense(row) {
        var decoded = decodeExpNotes(row.notes);
        return {
          id: row.id,
          title: row.title,
          amountCents: Math.round(parseFloat(row.amount) * 100) || 0,
          date: row.expense_date,
          category: decoded.category,
          paidBy: row.paid_by_name,
          paidByPhone: row.paid_by_phone,
          splits: (row.shares || []).map(function (s) {
            return {
              id: s.id,
              name: s.member_name,
              phone: s.member_phone,
              amountCents: Math.round(parseFloat(s.share_amount) * 100) || 0,
              cleared: !!s.cleared
            };
          }),
          note: decoded.note,
          addedBy: "",
          createdAt: row.created_at,
          updatedAt: row.updated_at
        };
      }
      function loadExpenses() {
        if (!state.token) return Promise.resolve();
        return rpc("list_expenses", { p_token: state.token })
          .then(function (rows) {
            state.expenses = (rows || []).map(mapServerExpense);
            state.expensesError = null;
          })
          .catch(function (err) {
            if (handleSessionExpiry(err)) return;
            state.expensesError = err.message || "Couldn't load expenses.";
          })
          .then(function () { if (state.token) render(); });
      }
      function money(cents) {
        return "$" + (Math.round(cents || 0) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      function parseMoneyToCents(str) {
        var n = parseFloat(String(str == null ? "" : str).replace(/[^0-9.]/g, ""));
        return isNaN(n) ? 0 : Math.round(n * 100);
      }
      function formatExpenseDate(dateStr) {
        var parts = String(dateStr || "").split("-").map(Number);
        if (!parts[0]) return "";
        var d = new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      }
      // Shares owed to the payer (the payer's own share is never a debt).
      function isPayerShare(exp, s) {
        if (exp.paidByPhone && s.phone) return s.phone === exp.paidByPhone;
        return s.name === exp.paidBy;
      }
      function owedShares(exp) {
        return (exp.splits || []).filter(function (s) { return !isPayerShare(exp, s); });
      }
      function expenseStatus(exp) {
        var owed = owedShares(exp);
        if (!owed.length) return "Cleared";
        var cleared = owed.filter(function (s) { return s.cleared; }).length;
        if (cleared === owed.length) return "Cleared";
        if (cleared > 0) return "Partially cleared";
        return "Open";
      }
      function statusClass(status) {
        return status === "Cleared" ? "st-cleared" : status === "Partially cleared" ? "st-partial" : "st-open";
      }
      function openShareCents(exp) {
        return owedShares(exp).reduce(function (sum, s) { return sum + (s.cleared ? 0 : s.amountCents); }, 0);
      }
      function settledShareCents(exp) {
        return owedShares(exp).reduce(function (sum, s) { return sum + (s.cleared ? s.amountCents : 0); }, 0);
      }
      // Everyone who can appear in a split on the shared board: crew
      // members only (the server requires payer and split to be on the
      // crew list), plus anyone already on the expense being edited so
      // their row doesn't vanish if they have since left the crew list.
      function participantCandidates(extra) {
        var seen = {}, out = [];
        function add(name, phone) {
          var key = phone ? "p:" + phone : "n:" + String(name || "").trim().toLowerCase();
          if ((name || phone) && !seen[key]) { seen[key] = true; out.push({ name: name || "", phone: phone || "" }); }
        }
        state.members.forEach(function (m) { add(m.name, m.phone_digits); });
        (extra || []).forEach(function (p) {
          if (typeof p === "string") add(p, "");
          else if (p) add(p.name, p.phone);
        });
        return out;
      }

      /* ---------------- Supabase RPC ---------------- */
      function rpc(fn, body) {
        return fetch(SB_URL + "/rest/v1/rpc/" + fn, {
          method: "POST",
          headers: {
            "apikey": SB_KEY,
            "Authorization": "Bearer " + SB_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body || {})
        }).catch(function () {
          throw new Error("Couldn\u2019t reach the board \u2014 check your connection and try again.");
        }).then(function (res) {
          return res.text().then(function (text) {
            var data = null;
            try { data = text ? JSON.parse(text) : null; } catch (e) { /* keep null */ }
            if (!res.ok) {
              var msg = data && data.message ? data.message : "Request failed (" + res.status + "). Try again.";
              var err = new Error(msg);
              err.code = data && data.code;
              throw err;
            }
            return data;
          });
        });
      }
      function isSessionError(err) {
        return !!err && /invalid or expired session/i.test(err.message || "");
      }
      function handleSessionExpiry(err) {
        if (isSessionError(err)) {
          clearSession();
          render();
          return true;
        }
        return false;
      }
    </script>
    <script>
      "use strict";

      /* ---------------- data loading ---------------- */
      function loadBoard() {
        var expensesFetch = rpc("list_expenses", { p_token: state.token })
          .then(function (rows) { return { ok: true, rows: rows || [] }; })
          .catch(function (err) { return { ok: false, err: err }; });
        return Promise.all([
          rpc("list_contacts", { p_token: state.token }),
          rpc("list_members", { p_token: state.token }),
          expensesFetch
        ]).then(function (results) {
          state.contacts = results[0] || [];
          state.members = results[1] || [];
          state.loadError = null;
          var exp = results[2];
          if (exp.ok) {
            state.expenses = exp.rows.map(mapServerExpense);
            state.expensesError = null;
          } else if (!handleSessionExpiry(exp.err)) {
            state.expensesError = exp.err.message || "Couldn't load expenses.";
          }
        }).catch(function (err) {
          if (handleSessionExpiry(err)) return;
          state.loadError = err.message || "Couldn't load the board.";
        }).then(render);
      }
      function loadActivity() {
        return rpc("list_activity", { p_token: state.token, p_limit: 100 })
          .then(function (rows) { state.activity = rows || []; })
          .catch(function (err) {
            if (handleSessionExpiry(err)) return;
            state.activity = [];
          })
          .then(render);
      }
      function isOwner() {
        // The owner is the earliest-joined member (setup adds them first).
        if (!state.members.length || !state.myPhone) return false;
        return state.members[0].phone_digits === state.myPhone;
      }
      function ownerPhone() {
        return state.members.length ? state.members[0].phone_digits : null;
      }

      /* ---------------- gate screens ---------------- */
      function gateShell(heading, inner) {

      }

            '<p class="hint" style="margin-top:4px">Share this code with the crew in person or in your group chat \u2014 everyone uses the same code with their own phone number.</p></div>' +
            '<p id="setup-error" class="msg-error" role="alert" hidden></p>' +

        document.getElementById("setup-form").addEventListener("submit", function (e) {

            .then(function (rows) {
              var row = rows && rows[0];

              state.myName = name;
              state.myPhone = digits(phone);
              state.configured = true;
              persistSession();
              render();
              loadBoard();
            })
            .catch(function (err) {
              btn.disabled = false;
              btn.textContent = "Create crew access";
              errEl.textContent = err.message || "Setup failed. Try again.";
              errEl.hidden = false;
            });
        });
      }

      function renderSignin() {
        document.getElementById("root").innerHTML = gateShell("Crew sign-in",
          '<p class="lede">This board is crew-only. Enter the phone number you\u2019re on the crew list with, plus the shared secret code.</p>' +
          '<form id="signin-form" class="form-stack" style="margin-top:24px">' +
            '<div><label class="field-label" for="signin-phone">Phone number</label>' +
            '<input id="signin-phone" class="input" type="tel" inputmode="tel" autocomplete="tel" required placeholder="(206) 555-0100" /></div>' +
            '<div><label class="field-label" for="signin-code">Secret code</label>' +
            '<input id="signin-code" class="input" type="password" autocomplete="current-password" required placeholder="The crew code" /></div>' +
            '<p id="signin-error" class="msg-error" role="alert" hidden></p>' +
            '<button id="signin-submit" type="submit" class="btn-primary">Unlock the board</button>' +
            '<p class="hint">Not on the list yet? Ask whoever set this up to add your number from the Crew panel inside. You\u2019ll stay signed in on this device for 30 days.</p>' +
          "</form>");

        document.getElementById("signin-form").addEventListener("submit", function (e) {
          e.preventDefault();
          var phone = document.getElementById("signin-phone").value.trim();
          var code = document.getElementById("signin-code").value;
          var errEl = document.getElementById("signin-error");
          var btn = document.getElementById("signin-submit");
          errEl.hidden = true;
          btn.disabled = true;
          btn.textContent = "Checking\u2026";
          rpc("verify_signin", { p_phone: phone, p_code: code })
            .then(function (rows) {
              var row = rows && rows[0];
              if (!row || !row.token) throw new Error("Couldn\u2019t sign you in.");
              state.token = row.token;
              state.myName = row.member_name;
              state.myPhone = digits(phone);
              persistSession();
              render();
              loadBoard();
            })
            .catch(function (err) {
              btn.disabled = false;
              btn.textContent = "Unlock the board";
              if (/setup has not been completed/i.test(err.message || "")) {
                state.configured = false;
                render();
                return;
              }
              errEl.textContent = err.message || "Couldn\u2019t sign you in.";
              errEl.hidden = false;
            });
        });
      }

      /* ---------------- contact card ---------------- */
      function contactCard(c) {
        var reasons = attentionReasons(c);
        var idx = STAGES.indexOf(c.stage);
        var nextStage = idx >= 0 && idx < STAGES.length - 1 ? STAGES[idx + 1] : null;
        var html = '<article class="card">' +
          '<button type="button" class="card-open" data-open-contact="' + c.id + '" aria-label="Open ' + esc(c.name) + '">' +
            '<span style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">' +

            "</span>";
        if (c.instagram_handle) {
          html += '<span class="card-ig">@' + esc(String(c.instagram_handle).replace(/^@/, "")) + "</span>";
        }
        if (c.next_step) {
          html += '<span class="card-next">Next: ' + esc(c.next_step) + "</span>";
        }
        var chips = followUpChip(c);
        if (reasons.length) chips += '<span class="chip chip-attention">Needs attention</span>';
        if (chips) html += '<span class="chip-row">' + chips + "</span>";
        html += '<span class="card-meta">Added by ' + esc(c.added_by) + " · updated " + relativeTime(c.updated_at) + "</span>" +
          "</button>";
        if (nextStage) {
          html += '<button type="button" class="advance-btn" data-advance="' + c.id + '" data-stage="' + esc(nextStage) + '"' +
            (state.busyStage[c.id] ? " disabled" : "") + ' aria-label="Move ' + esc(c.name) + " to " + esc(nextStage) + '">' +
            (state.busyStage[c.id] ? "Moving\u2026" : "Move to " + esc(nextStage) + " \u2192") + "</button>";
        }
        html += "</article>";
        return html;
      }

      /* ---------------- main views ---------------- */
      function countsLine() {
        var counts = {};
        state.contacts.forEach(function (c) { counts[c.contact_type] = (counts[c.contact_type] || 0) + 1; });
        var n = state.contacts.length;
        var parts = "";
        TYPES.forEach(function (t) {
          var c = counts[t] || 0;
          if (!c) return;
          var word = t === "DJ" ? (c === 1 ? "DJ" : "DJs")
            : t === "Venue" ? (c === 1 ? "venue" : "venues")
            : t === "Event host" ? (c === 1 ? "host" : "hosts") : "other";
          parts += " · " + c + " " + word;
        });
        return "<strong>" + n + "</strong> " + (n === 1 ? "contact" : "contacts") + parts;
      }
      function attentionList() {
        return state.contacts
          .map(function (c) { return { contact: c, reasons: attentionReasons(c) }; })
          .filter(function (x) { return x.reasons.length > 0; })
          .sort(function (a, b) { return a.contact.updated_at < b.contact.updated_at ? -1 : 1; });
      }

      function renderBoard(attention) {
        if (state.contacts.length === 0) {

            '<span class="ab-title">' + attention.length + (attention.length === 1 ? " contact needs" : " contacts need") + " attention</span>" +
            '<span class="ab-sub">No follow-up set, a follow-up due, or untouched for ' + STALE_DAYS + "+ days \u2014 tap to see who.</span></button>";

      function renderList() {

        var q = state.search.trim().toLowerCase();
        var filtered = state.contacts.filter(function (c) {
          if (state.typeFilter !== "All" && c.contact_type !== state.typeFilter) return false;

        var html = '<div><label class="sr-only" for="search">Search contacts</label>' +

              '<span class="card-name">' + esc(c.name) + "</span>" + typeBadge(c.contact_type) + "</span>" +
            '<span class="list-sub"><span>' + esc(c.stage) + "</span>" +
            (c.instagram_handle ? '<span class="ig">@' + esc(String(c.instagram_handle).replace(/^@/, "")) + "</span>" : "") +
            "<span>· added by " + esc(c.added_by) + "</span></span>" +

        html += "</div>";
        return html;
      }

            '<span style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">' +

      /* ---------------- expenses view ---------------- */
      function renderExpenses() {
        if (state.expenses === null) {
          if (state.expensesError) {
            return '<div class="card"><p style="margin:0;font-size:14px">Couldn\u2019t load expenses.</p>' +
              '<p class="hint" style="margin-top:4px">' + esc(state.expensesError) + "</p>" +

          }
