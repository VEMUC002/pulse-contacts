        }
        var all = state.expenses || [];
        if (!all.length) {
          return '<div class="empty-state"><h2>No expenses yet</h2>' +
            "<p>Log what the crew spends on Pulse nights \u2014 venue costs, DJ fees, food, transport \u2014 " +
            "who paid, how it splits, and who has settled their share.</p>" +
            '<button type="button" class="btn-primary" data-add-expense>Add the first expense</button></div>';
        }
        var totalSpent = all.reduce(function (s, e) { return s + e.amountCents; }, 0);
        var stillOpen = all.reduce(function (s, e) { return s + openShareCents(e); }, 0);
        var settled = all.reduce(function (s, e) { return s + settledShareCents(e); }, 0);

        var html = '<div class="exp-summary">' +
          '<div class="exp-stat"><span class="v">' + money(totalSpent) + '</span><span class="k">Total spent · ' + all.length + (all.length === 1 ? " expense" : " expenses") + "</span></div>" +
          '<div class="exp-stat"><span class="v">' + money(stillOpen) + '</span><span class="k">Still to settle</span></div>' +
          '<div class="exp-stat"><span class="v">' + money(settled) + '</span><span class="k">Settled so far</span></div>' +
          "</div>";

        // Outstanding debts, aggregated debtor -> payer across open shares.
        var debts = {};
        all.forEach(function (e) {
          owedShares(e).forEach(function (s) {
            if (s.cleared) return;
            var key = s.name + "␀" + e.paidBy;
            if (!debts[key]) debts[key] = { from: s.name, to: e.paidBy, cents: 0, count: 0 };
            debts[key].cents += s.amountCents;
            debts[key].count += 1;
          });
        });
        var debtRows = Object.keys(debts).map(function (k) { return debts[k]; })
          .sort(function (a, b) { return b.cents - a.cents; });
        html += '<div class="card" style="margin-bottom:16px"><h3 style="font-family:var(--font-display);font-size:13px;font-weight:600;margin:0 0 4px">Who owes what</h3>';
        if (!debtRows.length) {
          html += '<p style="margin:4px 0 0;font-size:14px">Everyone\u2019s square \u2014 no shares are outstanding.</p>';
        } else {
          debtRows.forEach(function (d) {
            html += '<div class="debt-row"><span><strong>' + esc(d.from) + "</strong> owes <strong>" + esc(d.to) + "</strong>" +
              '<span style="color:var(--dim);font-size:12px"> · ' + d.count + (d.count === 1 ? " share" : " shares") + "</span></span>" +
              "<span>" + money(d.cents) + "</span></div>";
          });
        }
        html += "</div>";

        html += '<div><label class="sr-only" for="exp-search">Search expenses</label>' +
          '<input id="exp-search" class="input" type="search" placeholder="Search what it was for, who paid, category\u2026" value="' + esc(state.expSearch) + '" /></div>' +
          '<div class="filter-row" role="group" aria-label="Filter expenses by status">';
        EXP_STATUSES.forEach(function (s) {
          html += '<button type="button" class="filter-btn" data-exp-filter="' + esc(s) + '" aria-pressed="' +
            (state.expFilter === s) + '">' + esc(s) + "</button>";
        });
        html += '<button type="button" class="filter-btn" data-export-expenses style="margin-left:auto">Export CSV</button></div>';

        var q = state.expSearch.trim().toLowerCase();
        var filtered = all.filter(function (e) {
          if (state.expFilter !== "All" && expenseStatus(e) !== state.expFilter) return false;
          if (!q) return true;
          var hay = [e.title, e.category, e.paidBy, e.note || "", e.addedBy]
            .concat((e.splits || []).map(function (s) { return s.name; }))
            .join(" ").toLowerCase();
          return hay.indexOf(q) !== -1;
        }).slice().sort(function (a, b) {
          if (a.date !== b.date) return a.date < b.date ? 1 : -1;
          return a.createdAt < b.createdAt ? 1 : -1;
        });

        html += '<div class="stack" style="margin-top:16px">';
        if (!filtered.length) html += '<p class="section-intro">No expenses match that filter.</p>';
        filtered.forEach(function (e) {
          var status = expenseStatus(e);
          html += '<article class="card">' +
            '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">' +
              '<span class="card-name">' + esc(e.title) + "</span>" +
              '<span class="exp-amount">' + money(e.amountCents) + "</span></div>" +
            '<div class="list-sub"><span>' + esc(formatExpenseDate(e.date)) + '</span><span>·</span>' +
              '<span class="badge">' + esc(e.category) + "</span>" +
              "<span>Paid by <strong style=\"color:var(--text)\">" + esc(e.paidBy) + "</strong></span>" +
              '<span class="status-pill ' + statusClass(status) + '">' + esc(status) + "</span></div>" +
            '<div class="share-list">';
          (e.splits || []).forEach(function (s) {
            var own = isPayerShare(e, s);
            html += '<div class="share-row"><span class="share-who">' + esc(s.name) +
              ' <span class="share-amt">· ' + money(s.amountCents) + "</span></span>" +
              (own
                ? '<span class="hint">their share</span>'
                : '<button type="button" class="share-toggle" data-toggle-share="' + esc(s.id) + '"' +
                  (state.busyShare[s.id] ? " disabled" : "") +
                  ' aria-pressed="' + !!s.cleared + '" aria-label="Mark ' + esc(s.name) + "\u2019s share of " + esc(e.title) +
                  (s.cleared ? " as not cleared" : " as cleared") + '">' +
                  (state.busyShare[s.id] ? "Saving\u2026" : s.cleared ? "Cleared ✓" : "Mark cleared") + "</button>") +
              "</div>";
          });
          html += "</div>";
          if (e.note) html += '<p style="margin:8px 0 0;font-size:14px;color:var(--dim)">' + esc(e.note) + "</p>";
          html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px">' +
            (e.addedBy ? '<span class="card-meta" style="margin-top:0">Added by ' + esc(e.addedBy) + "</span>" : "<span></span>") +
            '<button type="button" class="btn-outline" data-edit-expense="' + e.id + '" style="padding:6px 14px" aria-label="Edit ' + esc(e.title) + '">Edit</button></div>' +
            "</article>";
        });
        html += "</div>";
        return html;
      }

      function exportExpensesCsv() {
        var rows = [["What", "Date", "Amount", "Category", "Paid by", "Status", "Split between", "Cleared", "Note", "Added by"]];
        (state.expenses || []).forEach(function (e) {
          rows.push([
            e.title, e.date, (e.amountCents / 100).toFixed(2), e.category, e.paidBy, expenseStatus(e),
            (e.splits || []).map(function (s) { return s.name + " " + (s.amountCents / 100).toFixed(2); }).join("; "),
            owedShares(e).filter(function (s) { return s.cleared; }).map(function (s) { return s.name; }).join("; "),
            e.note || "", e.addedBy
          ]);
        });
        var csv = rows.map(function (r) {
          return r.map(function (cell) { return '"' + String(cell).replace(/"/g, '""') + '"'; }).join(",");
        }).join("\n");
        var blob = new Blob([csv], { type: "text/csv" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "pulse-expenses.csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      }

      var ACTION_TEXT = {
        setup: function (d) { return "completed the crew setup"; },
        contact_added: function (d) { return "added " + d; },
        contact_updated: function (d) { return "updated " + d; },
        contact_deleted: function (d) { return "deleted " + d; },
        stage_changed: function (d) { return "moved " + d; },
        member_added: function (d) { return "added crew member " + d; },
        member_removed: function (d) { return "removed crew member " + d; },
        expense_added: function (d) { return "added expense " + d; },
        expense_updated: function (d) { return "updated expense " + d; },
        expense_deleted: function (d) { return "deleted expense " + d; },
        code_changed: function (d) { return d || "changed the secret code"; }
      };
      function renderActivity() {
        if (state.activity === null) return '<p class="section-intro">Loading activity\u2026</p>';
        if (!state.activity.length) return '<p class="section-intro">Nothing yet \u2014 adds, moves, and edits will show up here.</p>';
        var html = '<div class="stack">';
        state.activity.forEach(function (entry) {
          var fn = ACTION_TEXT[entry.action];
          var text = fn ? fn(entry.detail || "") : (entry.action + (entry.detail ? ": " + entry.detail : ""));
          html += '<div class="activity-row"><p><span class="actor">' + esc(entry.actor_name) + "</span> " +
            esc(text) + '</p><p class="when">' + relativeTime(entry.created_at) + "</p></div>";
        });
        html += "</div>";
        return html;
      }

      function renderApp() {
        var attention = state.contacts ? attentionList() : [];
        var openExpenses = (state.expenses || []).filter(function (e) { return expenseStatus(e) !== "Cleared"; }).length;
        var tabs = [
          { key: "board", label: "Board" },
          { key: "list", label: "List" },
          { key: "attention", label: "Attention", badge: attention.length },
          { key: "expenses", label: "Expenses", badge: openExpenses },
          { key: "activity", label: "Activity" }
        ];
        var html = '<header class="app-header"><div class="app-header-inner">' +
          '<div class="header-row"><p class="header-counts">' +
          (state.contacts ? countsLine() : "Loading\u2026") +
          '</p><button type="button" class="crew-btn" id="crew-open" aria-label="Open crew access panel">Crew · ' +
          esc(state.myName || "") + "</button></div>" +
          '<nav class="tabs" aria-label="Views">';
        tabs.forEach(function (t) {
          html += '<button type="button" class="tab-btn" data-tab="' + t.key + '" aria-pressed="' + (state.tab === t.key) + '">' +
            t.label + (t.badge ? '<span class="tab-badge">' + t.badge + "</span>" : "") + "</button>";
        });
        html += '</nav></div></header><main class="app-main">';

        if (state.actionError) {
          html += '<div class="card" style="border-color:var(--amber);margin-bottom:16px"><p class="msg-error" style="margin:0">' +
            esc(state.actionError) + "</p></div>";
          state.actionError = null;
        }
        if (state.tab === "expenses") {
          html += renderExpenses();
        } else if (state.loadError) {
          html += '<div class="card"><p style="margin:0;font-size:14px">Couldn\u2019t load the board.</p>' +
            '<p class="hint" style="margin-top:4px">' + esc(state.loadError) + "</p>" +
            '<button type="button" class="btn-outline-accent" id="retry-load" style="margin-top:8px;padding:6px 12px">Try again</button></div>';
        } else if (!state.contacts) {
          html += '<p class="section-intro">Loading contacts\u2026</p>';
        } else if (state.tab === "board") {
          html += renderBoard(attention);
        } else if (state.tab === "list") {
          html += renderList();
        } else if (state.tab === "attention") {
          html += renderAttention(attention);
        } else if (state.tab === "expenses") {
          html += renderExpenses();
        } else if (state.tab === "activity") {
          html += renderActivity();
        }
        html += "</main>" +
          (state.tab === "expenses"
            ? '<button type="button" class="fab" id="fab-add" aria-label="Add an expense">+ Add expense</button>'
            : '<button type="button" class="fab" id="fab-add" aria-label="Add a contact">+ Add contact</button>');

        document.getElementById("root").innerHTML = html;

        document.getElementById("crew-open").addEventListener("click", openCrewSheet);
        document.getElementById("fab-add").addEventListener("click", function () {
          if (state.tab === "expenses") openExpenseSheet(null);
          else openContactSheet(null);
        });
        var expSearch = document.getElementById("exp-search");
        if (expSearch) {
          expSearch.addEventListener("input", function () {
            state.expSearch = expSearch.value;
            var pos = expSearch.selectionStart;
            render();
            var again = document.getElementById("exp-search");
            if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
          });
        }
        var retry = document.getElementById("retry-load");
        if (retry) retry.addEventListener("click", loadBoard);
        var search = document.getElementById("search");
        if (search) {
          search.addEventListener("input", function () {
            state.search = search.value;
            var pos = search.selectionStart;
            render();
            var again = document.getElementById("search");
            if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
          });
        }
      }

      /* ---------------- root render ---------------- */
      function render() {
        closeSheets();
        if (!state.token) {
          if (state.configured === false) renderSetup();
          else renderSignin();
          return;
        }
        renderApp();
      }

      /* ---------------- global click delegation ---------------- */
      document.addEventListener("click", function (e) {
        var t = e.target;
        function closest(sel) { return t.closest ? t.closest(sel) : null; }

        var tabBtn = closest("[data-tab]");
        if (tabBtn) {
          state.tab = tabBtn.getAttribute("data-tab");
          render();
          if (state.tab === "activity" && state.activity === null) loadActivity();
          if (state.tab === "expenses" && state.expenses === null && !state.expensesError) loadExpenses();
          return;
        }
        var filterBtn = closest("[data-type-filter]");
        if (filterBtn) {
          state.typeFilter = filterBtn.getAttribute("data-type-filter");
          render();
          return;
        }
        var adv = closest("[data-advance]");
        if (adv) {
          var id = adv.getAttribute("data-advance");
          var stage = adv.getAttribute("data-stage");
          if (state.busyStage[id]) return;
          state.busyStage[id] = true;
          render();
          rpc("update_contact_stage", { p_token: state.token, p_contact_id: id, p_stage: stage })
            .then(function () { state.activity = null; return loadBoard(); })
            .catch(function (err) {
              if (!handleSessionExpiry(err)) {
                state.actionError = err.message || "Couldn't move that contact. Try again.";
                if (state.token) render();
              }
            })
            .then(function () { delete state.busyStage[id]; if (state.token) render(); });
          return;
        }
        var openBtn = closest("[data-open-contact]");
        if (openBtn) {
          var cid = openBtn.getAttribute("data-open-contact");
          var contact = (state.contacts || []).filter(function (c) { return c.id === cid; })[0];
          if (contact) openContactSheet(contact);
          return;
        }
        if (closest("[data-add-contact]")) { openContactSheet(null); return; }
        var expFilterBtn = closest("[data-exp-filter]");
        if (expFilterBtn) {
          state.expFilter = expFilterBtn.getAttribute("data-exp-filter");
          render();
          return;
        }
        if (closest("[data-export-expenses]")) { exportExpensesCsv(); return; }
        if (closest("[data-retry-expenses]")) { state.expenses = null; state.expensesError = null; render(); loadExpenses(); return; }
        var shareBtn = closest("[data-toggle-share]");
        if (shareBtn) {
          var shareId = shareBtn.getAttribute("data-toggle-share");
          if (state.busyShare[shareId]) return;
          var ownerExp = null, share = null;
          (state.expenses || []).forEach(function (x) {
            (x.splits || []).forEach(function (s) { if (s.id === shareId) { ownerExp = x; share = s; } });
          });
          if (!share) return;
          var newCleared = !share.cleared;
          share.cleared = newCleared; // optimistic; reverted if the save fails
          state.busyShare[shareId] = true;
          render();
          rpc("set_share_cleared", { p_token: state.token, p_share_id: shareId, p_cleared: newCleared })
            .then(function () {
              delete state.busyShare[shareId];
              state.activity = null;
              if (state.token) render();
            })
            .catch(function (err) {
              delete state.busyShare[shareId];
              share.cleared = !newCleared;
              if (!handleSessionExpiry(err)) {
                state.actionError = err.message || "Couldn't update that share. Try again.";
                if (state.token) render();
              }
            });
          return;
        }
        var editExpBtn = closest("[data-edit-expense]");
        if (editExpBtn) {
          var target = (state.expenses || []).filter(function (x) { return x.id === editExpBtn.getAttribute("data-edit-expense"); })[0];
          if (target) openExpenseSheet(target);
          return;
        }
        if (closest("[data-add-expense]")) { openExpenseSheet(null); return; }
        if (closest("[data-goto-attention]")) {
          state.tab = "attention";
          render();
          return;
        }
      });

      /* Refetch when the crew comes back to the tab, so changes made by
         someone else show up without a manual reload. */
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && state.token && state.contacts) loadBoard();
      });
    </script>
    <script>
      "use strict";

      /* ---------------- sheets ---------------- */
      var sheetRoot = document.getElementById("sheet-root");

      function closeSheets() { sheetRoot.innerHTML = ""; }
      function sheetShell(title, bodyHtml, label) {
        sheetRoot.innerHTML =
          '<div class="sheet-backdrop" id="sheet-backdrop">' +
            '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(label || title) + '">' +
              '<div class="sheet-head"><h2>' + esc(title) + "</h2>" +
              '<button type="button" class="sheet-close" id="sheet-close">Close</button></div>' +
              bodyHtml +
            "</div></div>";
        document.getElementById("sheet-close").addEventListener("click", closeSheets);
        document.getElementById("sheet-backdrop").addEventListener("click", function (e) {
          if (e.target === e.currentTarget) closeSheets();
        });
      }
      function fieldHtml(id, label, inner, hint) {
        return '<div><label class="field-label" for="' + id + '">' + esc(label) + "</label>" + inner +
          (hint ? '<p class="hint" style="margin-top:4px">' + hint + "</p>" : "") + "</div>";
      }
      function inputHtml(id, value, attrs) {
        return '<input id="' + id + '" class="input" value="' + esc(value || "") + '" ' + (attrs || "") + " />";
      }
      function optionsHtml(values, current) {
        return values.map(function (v) {
          return '<option value="' + esc(v) + '"' + (v === current ? " selected" : "") + ">" + esc(v) + "</option>";
        }).join("");
      }

      /* ---------------- contact editor ---------------- */
      function openContactSheet(contact) {
        var isNew = !contact;
        var c = contact || {
          name: "", contact_type: "DJ", stage: "To Contact", instagram_handle: "",
          phone: "", email: "", notes: "", next_step: "", follow_up_date: "", owner: ""
        };
        var memberNames = state.members.map(function (m) { return m.name; });

        var body = "";
        if (!isNew) {
          body += '<p class="hint" style="margin-top:4px">Added by ' + esc(c.added_by) +
            " · last updated " + relativeTime(c.updated_at) + "</p>";
        }
        body += '<form id="contact-form" class="form-stack" style="margin-top:16px">';
        body += fieldHtml("c-name", "Name *", inputHtml("c-name", c.name, 'required placeholder="Person, act, or venue name"'));
        body += '<div class="grid-2">' +
          fieldHtml("c-type", "Type",
            '<select id="c-type" class="input">' + optionsHtml(TYPES, c.contact_type) + "</select>") +
          fieldHtml("c-stage", "Stage",
            '<select id="c-stage" class="input">' + optionsHtml(STAGES, c.stage) + "</select>") +
          "</div>";
        body += fieldHtml("c-instagram", "Instagram handle",
          inputHtml("c-instagram", c.instagram_handle, 'placeholder="@handle" autocapitalize="none"'));
        body += '<div class="grid-2">' +
          fieldHtml("c-phone", "Phone", inputHtml("c-phone", c.phone, 'type="tel" inputmode="tel" placeholder="Optional"')) +
          fieldHtml("c-email", "Email", inputHtml("c-email", c.email, 'type="email" inputmode="email" autocapitalize="none" placeholder="Optional"')) +
          "</div>";
        body += fieldHtml("c-next", "Next step",
          inputHtml("c-next", c.next_step, 'placeholder="e.g. Send the Pulse intro DM"'));
        body += '<div class="grid-2">' +
          fieldHtml("c-follow", "Follow-up date",
            '<input id="c-follow" type="date" class="input" value="' + esc(c.follow_up_date || "") + '" />',
            "No date = shows under Needs attention.") +
          fieldHtml("c-owner", "Owner (who\u2019s on it)",
            '<input id="c-owner" class="input" list="member-names" value="' + esc(c.owner || "") + '" placeholder="Optional" />' +
            '<datalist id="member-names">' +
            memberNames.map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join("") +
            "</datalist>") +
          "</div>";
        body += fieldHtml("c-notes", "Notes",
          '<textarea id="c-notes" class="input" rows="4" placeholder="How you met, what they play, who introduced you\u2026">' +
          esc(c.notes || "") + "</textarea>");

        if (!isNew && (c.phone || c.email || c.instagram_handle)) {
          body += '<div class="quick-links">';
          if (c.phone) body += '<a href="tel:' + esc(String(c.phone).replace(/[^+\d]/g, "")) + '">Call</a>';
          if (c.email) body += '<a href="mailto:' + esc(c.email) + '">Email</a>';
          if (c.instagram_handle) {
            body += '<a href="https://instagram.com/' + esc(String(c.instagram_handle).replace(/^@/, "")) +
              '" target="_blank" rel="noreferrer">Instagram</a>';
          }
          body += "</div>";
        }

        body += '<p id="c-error" class="msg-error" role="alert" hidden></p>';
        body += '<button id="c-save" type="submit" class="btn-primary">' + (isNew ? "Add contact" : "Save changes") + "</button>";
        if (!isNew) {
          body += '<div id="c-delete-zone">' +
            '<button type="button" id="c-delete" class="btn-outline" style="width:100%">Delete this contact</button></div>';
        }
        body += "</form>";

        sheetShell(isNew ? "Add a contact" : "Edit contact", body, isNew ? "Add a contact" : "Edit " + c.name);

        document.getElementById("contact-form").addEventListener("submit", function (e) {
          e.preventDefault();
          var errEl = document.getElementById("c-error");
          var btn = document.getElementById("c-save");
          var get = function (id) { return document.getElementById(id).value; };
          var payload = {
            p_name: get("c-name").trim(),
            p_contact_type: get("c-type"),
            p_instagram_handle: get("c-instagram").trim() || null,
            p_phone: get("c-phone").trim() || null,
            p_email: get("c-email").trim() || null,
            p_notes: get("c-notes"),
            p_next_step: get("c-next"),
            p_follow_up_date: get("c-follow") || null,
            p_stage: get("c-stage"),
            p_owner: get("c-owner").trim() || null
          };
          errEl.hidden = true;
          btn.disabled = true;
          btn.textContent = "Saving\u2026";
          var call = isNew
            ? rpc("add_contact", Object.assign({ p_token: state.token }, payload))
            : rpc("update_contact", Object.assign({ p_token: state.token, p_contact_id: c.id }, payload));
          call.then(function () {
            state.activity = null;
            closeSheets();
            return loadBoard();
          }).catch(function (err) {
            if (handleSessionExpiry(err)) return;
            btn.disabled = false;
            btn.textContent = isNew ? "Add contact" : "Save changes";
            errEl.textContent = err.message || "Couldn\u2019t save. Check the fields and try again.";
            errEl.hidden = false;
          });
        });

        if (!isNew) {
          document.getElementById("c-delete").addEventListener("click", function () {
            var zone = document.getElementById("c-delete-zone");
            zone.innerHTML =
              '<div class="delete-confirm">' +
                '<button type="button" id="c-delete-yes" class="btn-danger-outline">Yes, delete ' + esc(c.name) + "</button>" +
                '<button type="button" id="c-delete-no" class="btn-outline">Keep it</button>' +
              "</div>";
            document.getElementById("c-delete-no").addEventListener("click", function () { openContactSheet(contact); });
            document.getElementById("c-delete-yes").addEventListener("click", function () {
              var yesBtn = document.getElementById("c-delete-yes");
              yesBtn.disabled = true;
              yesBtn.textContent = "Deleting\u2026";
              rpc("delete_contact", { p_token: state.token, p_contact_id: c.id })
                .then(function () {
                  state.activity = null;
                  closeSheets();
                  return loadBoard();
                })
                .catch(function (err) {
                  if (handleSessionExpiry(err)) return;
                  yesBtn.disabled = false;
                  yesBtn.textContent = "Yes, delete " + c.name;
                  var errEl = document.getElementById("c-error");
                  errEl.textContent = err.message || "Couldn\u2019t delete. Try again.";
                  errEl.hidden = false;
                });
            });
          });
        }
      }

      /* ---------------- expense editor ---------------- */
      function splitRowHtml(person, included, amountStr, cleared, customMode) {
        return '<div class="split-row" data-split-row data-name="' + esc(person.name) + '" data-phone="' + esc(person.phone || "") + '">' +
          '<button type="button" class="split-include" data-split-include aria-pressed="' + !!included + '" aria-label="Include ' + esc(person.name) + ' in the split">' + esc(person.name) + "</button>" +
          '<input class="input split-amt" data-split-amt type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="' + esc(amountStr || "") + '"' + (customMode ? "" : " disabled") + ' aria-label="Share amount for ' + esc(person.name) + '" />' +
          '<button type="button" class="split-cleared" data-split-cleared aria-pressed="' + !!cleared + '" aria-label="Toggle whether ' + esc(person.name) + ' has cleared their share">' + (cleared ? "Cleared ✓" : "Pending") + "</button>" +
          "</div>";
      }

      function openExpenseSheet(expense) {
        var isNew = !expense;
        var e = expense || {
          title: "", amountCents: 0, date: todayStr(), category: "Other",
          paidBy: state.myName || "", paidByPhone: state.myPhone || "", splits: null, note: ""
        };
        var savedByPhone = {}, savedByName = {};
        (e.splits || []).forEach(function (s) {
          if (s.phone) savedByPhone[s.phone] = s;
          savedByName[s.name] = s;
        });
        var savedPeople = (e.splits || []).map(function (s) { return { name: s.name, phone: s.phone }; });
        if (e.paidBy) savedPeople.push({ name: e.paidBy, phone: e.paidByPhone });
        var candidates = participantCandidates(savedPeople);
        var memberPhones = {};
        state.members.forEach(function (m) { memberPhones[m.phone_digits] = true; });
        // Custom mode if saved shares aren't an equal division of the total.
        var customMode = false;
        if (e.splits && e.splits.length > 1) {
          var first = e.splits[0].amountCents;
          customMode = e.splits.some(function (s) { return Math.abs(s.amountCents - first) > 1; });
        }

        var body = '<form id="expense-form" class="form-stack" style="margin-top:16px">';
        body += fieldHtml("e-title", "What was it for? *",
          inputHtml("e-title", e.title, 'required placeholder="e.g. Venue deposit for Dec 12 night"'));
        body += '<div class="grid-2">' +
          fieldHtml("e-amount", "Total amount ($) *",
            '<input id="e-amount" class="input" type="number" inputmode="decimal" min="0" step="0.01" required placeholder="0.00" value="' +
            (e.amountCents ? (e.amountCents / 100).toFixed(2) : "") + '" />') +
          fieldHtml("e-date", "Date",
            '<input id="e-date" type="date" class="input" value="' + esc(e.date || todayStr()) + '" />') +
          "</div>";
        var payerPhone = e.paidByPhone || "";
        if (!candidates.some(function (p) { return p.phone && p.phone === payerPhone; })) {
          payerPhone = state.myPhone && memberPhones[state.myPhone]
            ? state.myPhone
            : (candidates.filter(function (p) { return p.phone; })[0] || {}).phone || "";
        }
        var payerOptions = candidates.filter(function (p) { return p.phone; }).map(function (p) {
          return '<option value="' + esc(p.phone) + '"' + (p.phone === payerPhone ? " selected" : "") + ">" + esc(p.name) + "</option>";
        }).join("");
        body += '<div class="grid-2">' +
          fieldHtml("e-category", "Category",
            '<select id="e-category" class="input">' + optionsHtml(EXP_CATEGORIES, e.category) + "</select>") +
          fieldHtml("e-paidby", "Paid by *",
            '<select id="e-paidby" class="input">' + payerOptions + "</select>",
            "Expenses sync to the whole crew, so the payer and everyone in the split need to be on the crew list.") +
          "</div>";

        body += '<div><span class="field-label">How is it split?</span>' +
          '<div class="seg-row" role="group" aria-label="Split type">' +
          '<button type="button" class="seg-btn" id="e-split-equal" aria-pressed="' + !customMode + '">Split equally</button>' +
          '<button type="button" class="seg-btn" id="e-split-custom" aria-pressed="' + customMode + '">Custom amounts</button>' +
          "</div>" +
          '<p class="hint" style="margin-top:4px">Tap a name to include or leave them out. Use the Pending / Cleared button to record who has already settled. The shared board splits the total equally between the people included.</p></div>';

        body += '<div><span class="field-label">Split between</span><div id="e-splits">';
        candidates.forEach(function (person) {
          var saved = (person.phone && savedByPhone[person.phone]) || savedByName[person.name];
          var included = isNew ? !!person.phone : !!saved;
          body += splitRowHtml(
            person,
            included,
            saved ? (saved.amountCents / 100).toFixed(2) : "",
            saved ? !!saved.cleared : false,
            customMode
          );
        });
        body += "</div></div>";

        body += fieldHtml("e-note", "Note",
          '<textarea id="e-note" class="input" rows="2" placeholder="Receipt, payment method, anything worth remembering\u2026">' + esc(e.note || "") + "</textarea>");
        body += '<p id="e-error" class="msg-error" role="alert" hidden></p>';
        body += '<button id="e-save" type="submit" class="btn-primary">' + (isNew ? "Add expense" : "Save changes") + "</button>";
        if (!isNew) {
          body += '<div id="e-delete-zone">' +
            '<button type="button" id="e-delete" class="btn-outline" style="width:100%">Delete this expense</button></div>';
        }
        body += "</form>";

        sheetShell(isNew ? "Add an expense" : "Edit expense", body, isNew ? "Add an expense" : "Edit " + e.title);

        var splitType = customMode ? "custom" : "equal";
        function refreshSplitMode() {
          document.getElementById("e-split-equal").setAttribute("aria-pressed", splitType === "equal");
          document.getElementById("e-split-custom").setAttribute("aria-pressed", splitType === "custom");
          sheetRoot.querySelectorAll("[data-split-amt]").forEach(function (inp) {
            inp.disabled = splitType !== "custom";
          });
        }
        document.getElementById("e-split-equal").addEventListener("click", function () { splitType = "equal"; refreshSplitMode(); });
        document.getElementById("e-split-custom").addEventListener("click", function () { splitType = "custom"; refreshSplitMode(); });

        function wireSplitRow(row) {
          var inc = row.querySelector("[data-split-include]");
          inc.addEventListener("click", function () {
            inc.setAttribute("aria-pressed", inc.getAttribute("aria-pressed") !== "true");
          });
          var clr = row.querySelector("[data-split-cleared]");
          clr.addEventListener("click", function () {
            var on = clr.getAttribute("aria-pressed") !== "true";
            clr.setAttribute("aria-pressed", on);
            clr.textContent = on ? "Cleared ✓" : "Pending";
          });
        }
        sheetRoot.querySelectorAll("[data-split-row]").forEach(wireSplitRow);

        document.getElementById("expense-form").addEventListener("submit", function (ev) {
          ev.preventDefault();
          var errEl = document.getElementById("e-error");
          var btn = document.getElementById("e-save");
          var showErr = function (msg) {
            errEl.textContent = msg;
            errEl.hidden = false;
            btn.disabled = false;
            btn.textContent = isNew ? "Add expense" : "Save changes";
          };
          errEl.hidden = true;
          var title = document.getElementById("e-title").value.trim();
          var totalCents = parseMoneyToCents(document.getElementById("e-amount").value);
          var paidByPhone = document.getElementById("e-paidby").value;
          if (!title) { showErr("Give the expense a name \u2014 what was it for?"); return; }
          if (totalCents <= 0) { showErr("Enter the total amount spent."); return; }
          if (!paidByPhone) { showErr("Say who paid \u2014 the payer needs to be on the crew list."); return; }

          var included = [];
          var missingPhone = false;
          sheetRoot.querySelectorAll("[data-split-row]").forEach(function (row) {
            if (row.querySelector("[data-split-include]").getAttribute("aria-pressed") !== "true") return;
            var phone = row.getAttribute("data-phone");
            if (!phone) missingPhone = true;
            included.push({
              name: row.getAttribute("data-name"),
              phone: phone,
              amountCents: parseMoneyToCents(row.querySelector("[data-split-amt]").value),
              cleared: row.querySelector("[data-split-cleared]").getAttribute("aria-pressed") === "true"
            });
          });
          if (!included.length) { showErr("Include at least one person in the split."); return; }
          if (missingPhone) {
            showErr("Everyone in the split needs to be on the crew list for the expense to sync \u2014 add them from the Crew panel first.");
            return;
          }

          if (splitType === "custom") {
            var sum = included.reduce(function (s2, x) { return s2 + x.amountCents; }, 0);
            if (sum !== totalCents) {
              showErr("The shares add up to " + money(sum) + " but the total is " + money(totalCents) +
                " \u2014 adjust them so they match.");
              return;
            }
            var firstAmt = included[0].amountCents;
            var uneven = included.some(function (s) { return Math.abs(s.amountCents - firstAmt) > 1; });
            if (uneven) {
              showErr("The shared board splits each expense equally between the people included, so uneven custom amounts can\u2019t be saved yet. Switch to \u201cSplit equally\u201d to save this expense.");
              return;
            }
          }
          // The payer's own share is settled by definition.
          included.forEach(function (s) { if (s.phone === paidByPhone) s.cleared = true; });
          var desiredCleared = {};
          included.forEach(function (s) { desiredCleared[s.phone] = s.cleared; });

          btn.disabled = true;
          btn.textContent = "Saving\u2026";
          var payload = {
            p_token: state.token,
            p_title: title,
            p_amount: totalCents / 100,
            p_paid_by_phone: paidByPhone,
            p_split_phones: included.map(function (s) { return s.phone; }),
            p_expense_date: document.getElementById("e-date").value || todayStr(),
            p_notes: encodeExpNotes(
              document.getElementById("e-category").value,
              document.getElementById("e-note").value.trim()
            )
          };
          var saveCall = isNew
            ? rpc("add_expense", payload)
            : rpc("update_expense", Object.assign({ p_expense_id: e.id }, payload));
          saveCall.then(function (newId) {
            var expenseId = isNew ? newId : e.id;
            state.activity = null;
            // The server creates shares uncleared; apply the cleared
            // flags chosen in this form (payer included) share by share.
            return rpc("list_expenses", { p_token: state.token }).then(function (rows) {
              var fresh = (rows || []).map(mapServerExpense);
              state.expenses = fresh;
              state.expensesError = null;
              var saved = fresh.filter(function (x) { return x.id === expenseId; })[0];
              if (!saved) return null;
              var fixes = [];
              saved.splits.forEach(function (s) {
                var want = desiredCleared[s.phone];
                if (want !== undefined && want !== s.cleared) {
                  fixes.push(rpc("set_share_cleared", { p_token: state.token, p_share_id: s.id, p_cleared: want }));
                }
              });
              return fixes.length ? Promise.all(fixes) : null;
            });
          }).then(function () {
            closeSheets();
            return loadExpenses();
          }).catch(function (err) {
            if (handleSessionExpiry(err)) return;
            showErr(err.message || "Couldn\u2019t save the expense. Try again.");
          });
        });

        if (!isNew) {
          document.getElementById("e-delete").addEventListener("click", function () {
            var zone = document.getElementById("e-delete-zone");
            zone.innerHTML =
              '<div class="delete-confirm">' +
                '<button type="button" id="e-delete-yes" class="btn-danger-outline">Yes, delete it</button>' +
                '<button type="button" id="e-delete-no" class="btn-outline">Keep it</button>' +
              "</div>";
            document.getElementById("e-delete-no").addEventListener("click", function () { openExpenseSheet(expense); });
            document.getElementById("e-delete-yes").addEventListener("click", function () {
              var yesBtn = document.getElementById("e-delete-yes");
              yesBtn.disabled = true;
              yesBtn.textContent = "Deleting\u2026";
              rpc("delete_expense", { p_token: state.token, p_expense_id: e.id })
                .then(function () {
                  state.activity = null;
                  closeSheets();
                  return loadExpenses();
                })
                .catch(function (err) {
                  if (handleSessionExpiry(err)) return;
                  yesBtn.disabled = false;
                  yesBtn.textContent = "Yes, delete it";
                  var errEl = document.getElementById("e-error");
                  errEl.textContent = err.message || "Couldn\u2019t delete. Try again.";
                  errEl.hidden = false;
                });
            });
          });
        }
      }

      /* ---------------- crew panel ---------------- */
      function openCrewSheet() {
        var mine = isOwner();
        var oPhone = ownerPhone();
        var body = '<p class="section-intro" style="margin-top:8px">Only these phone numbers, plus the shared secret code, can open this board. Signed in as <span style="color:var(--text)">' +
          esc(state.myName || "") + "</span>" + (mine ? " (owner)" : "") + ".</p>";

        body += '<form id="member-form" class="form-stack" style="margin-top:20px">' +
          '<h3 style="margin:0">Add a crew member</h3>' +
          fieldHtml("m-name", "Their name", inputHtml("m-name", "", 'required placeholder="e.g. Hasini"')) +
          fieldHtml("m-phone", "Their phone number",
            inputHtml("m-phone", "", 'type="tel" inputmode="tel" autocomplete="tel" required placeholder="(206) 555-0100"') +
            '<p class="hint" id="m-phone-hint" style="margin-top:4px" hidden></p>') +
          '<button id="m-add" type="submit" class="btn-outline-accent" style="width:100%">Add to crew list</button>' +
          '<p id="m-msg" style="margin:0" hidden></p>' +
          "</form>";

        body += '<h3>On the crew list</h3><div class="stack" style="margin-top:8px" id="member-list">';
        if (!state.members.length) body += '<p class="section-intro">Loading crew\u2026</p>';
        state.members.forEach(function (m) {
          var isTheOwner = m.phone_digits === oPhone;
          body += '<div class="member-row"><div>' +
            '<p class="m-name">' + esc(m.name) + (isTheOwner ? '<span class="owner-tag">owner</span>' : "") + "</p>" +
            '<p class="m-phone">' + esc(m.phone_digits) + " · added by " + esc(m.added_by) + "</p></div>" +
            (mine && !isTheOwner
              ? '<button type="button" class="remove-btn" data-remove-member="' + m.id + '" data-member-name="' + esc(m.name) + '" aria-label="Remove ' + esc(m.name) + ' from the crew list">Remove</button>'
              : "") +
            "</div>";
        });
        body += '</div><p id="member-list-msg" class="msg-error" style="margin-top:8px" hidden></p>';

        if (mine) {
          body += '<form id="code-form" class="form-stack" style="margin-top:24px">' +
            '<h3 style="margin:0">Change the secret code</h3>' +
            fieldHtml("s-new", "New code (at least 4 characters)",
              '<input id="s-new" class="input" type="password" autocomplete="new-password" required minlength="4" />',
              "Changing the code signs everyone else out \u2014 they\u2019ll need the new code to get back in. You stay signed in here.") +
            '<button id="s-change" type="submit" class="btn-outline" style="width:100%">Change code</button>' +
            '<p id="s-msg" style="margin:0" hidden></p>' +
            "</form>";
        }

        body += '<button type="button" id="sign-out" class="btn-outline" style="width:100%;margin-top:24px;color:var(--dim)">Sign out of this device</button>';

        sheetShell("Crew access", body);

        /* live phone preview + duplicate warning, same digits rule as the server */
        var phoneInput = document.getElementById("m-phone");
        var hint = document.getElementById("m-phone-hint");
        phoneInput.addEventListener("input", function () {
          var d = digits(phoneInput.value);
          var dup = state.members.filter(function (m) { return m.phone_digits === d; })[0];
          if (!phoneInput.value.trim()) { hint.hidden = true; return; }
          hint.hidden = false;
          if (dup) {
            hint.innerHTML = '<span style="color:var(--amber)">That number is already on the crew list for ' + esc(dup.name) + ".</span>";
          } else if (d.length >= 7) {
            hint.innerHTML = "They\u2019ll sign in with: <span style=\"color:var(--text)\">" + esc(d) + "</span> \u2014 plus the crew code.";
          } else {
            hint.textContent = "Keep typing \u2014 the full number with area code.";
          }
        });

        document.getElementById("member-form").addEventListener("submit", function (e) {
          e.preventDefault();
          var name = document.getElementById("m-name").value.trim();
          var phone = document.getElementById("m-phone").value.trim();
          var msg = document.getElementById("m-msg");
          var btn = document.getElementById("m-add");
          var d = digits(phone);
          var showMsg = function (ok, text) {
            msg.hidden = false;
            msg.className = ok ? "msg-ok" : "msg-error";
            msg.setAttribute("role", ok ? "status" : "alert");
            msg.textContent = text;
          };
          msg.hidden = true;
          var dup = state.members.filter(function (m) { return m.phone_digits === d; })[0];
          if (dup) {
            showMsg(false, "That number is already on the crew list \u2014 it\u2019s saved for " + dup.name +
              ". If the number\u2019s right, they\u2019re already added and can sign in with it plus the crew code.");
            return;
          }
          if (d.length < 7 || d.length > 15) {
            showMsg(false, "That phone number doesn\u2019t look complete \u2014 enter the full number with area code, exactly as they\u2019ll type it to sign in.");
            return;
          }
          btn.disabled = true;
          btn.textContent = "Adding\u2026";
          rpc("add_member", { p_token: state.token, p_name: name, p_phone: phone })
            .then(function () {
              state.activity = null;
              return rpc("list_members", { p_token: state.token });
            })
            .then(function (rows) {
              state.members = rows || [];
              openCrewSheet();
              var m2 = document.getElementById("m-msg");
              m2.hidden = false;
              m2.className = "msg-ok";
              m2.setAttribute("role", "status");
              m2.textContent = "Added " + name + " \u2014 they\u2019re on the crew list and can sign in with that number and the crew code.";
            })
            .catch(function (err) {
              if (handleSessionExpiry(err)) return;
              btn.disabled = false;
              btn.textContent = "Add to crew list";
              showMsg(false, err.message || "Couldn\u2019t add them \u2014 check your connection and try again.");
            });
        });

        sheetRoot.querySelectorAll("[data-remove-member]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var id = btn.getAttribute("data-remove-member");
            var listMsg = document.getElementById("member-list-msg");
            listMsg.hidden = true;
            btn.disabled = true;
            btn.textContent = "Removing\u2026";
            rpc("remove_member", { p_token: state.token, p_member_id: id })
              .then(function () {
                state.activity = null;
                return rpc("list_members", { p_token: state.token });
              })
              .then(function (rows) {
                state.members = rows || [];
                openCrewSheet();
              })
              .catch(function (err) {
                if (handleSessionExpiry(err)) return;
                btn.disabled = false;
                btn.textContent = "Remove";
                listMsg.textContent = err.message || "Couldn\u2019t remove them. Try again.";
                listMsg.hidden = false;
              });
          });
        });

        var codeForm = document.getElementById("code-form");
        if (codeForm) {
          codeForm.addEventListener("submit", function (e) {
            e.preventDefault();
            var newCode = document.getElementById("s-new").value;
            var msg = document.getElementById("s-msg");
            var btn = document.getElementById("s-change");
            msg.hidden = true;
            btn.disabled = true;
            btn.textContent = "Changing\u2026";
            rpc("change_code", { p_token: state.token, p_new_code: newCode })
              .then(function (rows) {
                var row = rows && rows[0];
                if (row && row.token) {
                  state.token = row.token;
                  persistSession();
                }
                state.activity = null;
                openCrewSheet();
                var m2 = document.getElementById("s-msg");
                m2.hidden = false;
                m2.className = "msg-ok";
                m2.setAttribute("role", "status");
                m2.textContent = "Code changed \u2014 tell the crew the new one. Everyone else will need it next time they sign in.";
              })
              .catch(function (err) {
                if (handleSessionExpiry(err)) return;
                btn.disabled = false;
                btn.textContent = "Change code";
                msg.hidden = false;
                msg.className = "msg-error";
                msg.setAttribute("role", "alert");
                msg.textContent = err.message || "Couldn\u2019t change the code. Try again.";
              });
          });
        }

        document.getElementById("sign-out").addEventListener("click", function () {
          clearSession();
          render();
        });
      }

      /* ---------------- boot ---------------- */
      (function boot() {
        state.token = readStored(TOKEN_KEY);
        state.myName = readStored(NAME_KEY);
        state.myPhone = readStored(PHONE_KEY);
        if (state.token) {
          render();
          loadBoard();
          return;
        }
        document.getElementById("root").innerHTML =
          '<div class="center-screen"><p>Loading\u2026</p></div>';
        /* Probe: verify_signin answers "Setup has not been completed yet."
           until the owner runs first-time setup; any other answer (or a
           network hiccup) means the sign-in form is the right default. */
        rpc("verify_signin", { p_phone: "", p_code: "" })
          .then(function () { state.configured = true; render(); })
          .catch(function (err) {
            state.configured = !/setup has not been completed/i.test((err && err.message) || "");
            render();
          });
      })();
    </script>
  </body>
</html>
